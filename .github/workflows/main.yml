name: GuardVPN Full Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install WireGuard
        run: sudo apt-get install -y wireguard resolvconf iproute2 iputils-ping curl

      - name: IP before VPN
        run: curl -s ifconfig.me && echo ""

      - name: Create WireGuard config
        run: |
          sudo bash -c 'cat > /etc/wireguard/wg0.conf << EOF
          [Interface]
          Address = 10.0.1.2/32
          PrivateKey = 8PmnB3Omdsa+bkv1ZEjpGgOMp5CIPO6JcKEbm1GQfmo=
          DNS = 8.8.8.8

          [Peer]
          PublicKey = J3k+vf4xU/FZni/gGcPsVCbi2H0GLuA9eHusL3Su2Uo=
          Endpoint = 143.198.219.76:51820
          AllowedIPs = 0.0.0.0/0, ::/0
          PersistentKeepalive = 25
          EOF'

      - name: Connect VPN
        run: sudo wg-quick up wg0

      - name: Wait for handshake
        run: sleep 8

      - name: Check handshake
        run: sudo wg show

      - name: IP after VPN
        run: curl -s --interface wg0 ifconfig.me && echo ""

      - name: Ping node1
        run: ping -c 4 10.0.1.1

      - name: Ping node2
        run: ping -c 4 10.0.2.1

      - name: Ping node3
        run: ping -c 4 10.0.3.1

      - name: Confirm exit through node3
        run: curl -s --interface wg0 https://ipinfo.io
