name: GuardVPN Final Test
on: [push]
jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: sudo apt-get install -y wireguard-tools resolvconf curl iputils-ping

      - name: IP before VPN
        run: curl -s --max-time 10 https://api.ipify.org && echo ""

      - name: Write config
        run: |
          sudo mkdir -p /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf > /dev/null << 'WGEOF'
          [Interface]
          Address = 10.0.1.2/32
          PrivateKey = aIsOP+8URhXn8Gfmu8gB6I0b9kPuYpXrqFVyqCJKcFw=

          [Peer]
          PublicKey = njRC77hMjOjrt5a3kl/VsRccm5mbutAXKin6RZ09FF0=
          Endpoint = 143.198.219.76:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          WGEOF

      - name: Connect VPN
        run: sudo wg-quick up wg0

      - name: Wait for handshake
        run: sleep 10

      - name: Check handshake
        run: sudo wg show

      - name: Ping node1
        run: ping -c 4 10.0.1.1 || true

      - name: Ping node2
        run: ping -c 4 10.0.2.1 || true

      - name: Ping node3
        run: ping -c 4 10.0.3.1 || true

      - name: IP after VPN
        run: curl -s --max-time 15 https://api.ipify.org && echo ""

      - name: Location check
        run: curl -s --max-time 15 https://ipinfo.io/json && echo ""
