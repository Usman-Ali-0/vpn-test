name: VPN Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install WireGuard
        run: sudo apt-get install -y wireguard resolvconf

      - name: Check IP before VPN
        run: curl -m 10 ifconfig.me || echo "IP check done"

      - name: Create config
        run: |
          sudo bash -c 'cat > /etc/wireguard/wg0.conf << EOF
          [Interface]
          Address = 10.0.1.2/32
          PrivateKey = 8PmnB3Omdsa+bkv1ZEjpGgOMp5CIPO6JcKEbm1GQfmo=
          DNS = 8.8.8.8

          [Peer]
          PublicKey = J3k+vf4xU/FZni/gGcPsVCbi2H0GLuA9eHusL3Su2Uo=
          Endpoint = 143.198.219.76:51820
          AllowedIPs = 0.0.0.0/0, ::/0
          PersistentKeepalive = 25
          EOF'

      - name: Connect VPN
        run: sudo wg-quick up wg0

      - name: Check handshake
        run: sudo wg show

      - name: Wait for connection
        run: sleep 5

      - name: Check IP after VPN
        run: curl -m 10 ifconfig.me || echo "done"

      - name: Test ping node1
        run: ping -c 4 10.0.1.1

      - name: Test ping node3
        run: ping -c 4 10.0.3.1
