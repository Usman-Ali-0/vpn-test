name: GuardVPN Test 2
on: [push]
jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: sudo apt-get install -y wireguard-tools resolvconf curl

      - name: IP before VPN
        run: curl -s ifconfig.me && echo ""

      - name: Write config
        run: |
          sudo mkdir -p /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf > /dev/null << 'WGEOF'
          [Interface]
          Address = 10.0.1.2/32
          PrivateKey = 8PmnB3Omdsa+bkv1ZEjpGgOMp5CIPO6JcKEbm1GQfmo=

          [Peer]
          PublicKey = J3k+vf4xU/FZni/gGcPsVCbi2H0GLuA9eHusL3Su2Uo=
          Endpoint = 143.198.219.76:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          WGEOF

      - name: Connect VPN
        run: sudo wg-quick up wg0

      - name: Wait for handshake
        run: sleep 10

      - name: Check handshake
        run: sudo wg show

      - name: Ping node1
        run: ping -c 4 10.0.1.1 || true

      - name: Ping node3
        run: ping -c 4 10.0.3.1 || true

      - name: IP after VPN
        run: curl -s --max-time 15 ifconfig.me || echo "Failed"

      - name: Check node1 wg show
        run: ssh -o StrictHostKeyChecking=no root@143.198.219.76 'wg show'
